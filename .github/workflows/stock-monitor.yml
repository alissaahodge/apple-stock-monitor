name: Apple pickup stock monitor
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/stock-monitor.yml'
  workflow_dispatch:
    inputs:
      validate_only:
        description: 'Validate Apple inventory response without sending email'
        type: boolean
        default: true
      test_email:
        description: 'Send an email test (requires secrets)'
        type: boolean
        default: false
  schedule:
    - cron: '2/5 * * * *'

permissions:
  contents: write

concurrency:
  group: apple-stock-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Restore previous state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release download monitor-state --pattern stock-state.json --dir . 2>/dev/null; then
            mv stock-state.json .stock-state.json
          else
            echo "No previous state found"
          fi
      - name: Check pickup availability
        env:
          ZIP_CODE: '94086'
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
          VALIDATE: ${{ inputs.validate_only }}
          TEST_EMAIL: ${{ inputs.test_email }}
        run: |
          if [ "$TEST_EMAIL" = "true" ]; then
            python monitor.py --test-email
          elif [ "$VALIDATE" = "true" ] || [ "${{ github.event_name }}" = "push" ]; then
            python monitor.py --validate-only
          else
            python monitor.py
          fi
      - name: Save state for next check
        if: ${{ success() && !inputs.validate_only && !inputs.test_email }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view monitor-state >/dev/null 2>&1; then
            gh release upload monitor-state .stock-state.json#stock-state.json --clobber
          else
            gh release create monitor-state .stock-state.json#stock-state.json --title "Monitor state" --notes "Internal state for deduplicating alerts" --latest=false
          fi
