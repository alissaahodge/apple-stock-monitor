name: Apple pickup stock monitor
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/stock-monitor.yml'
      - 'monitor.py'
      - 'tests/**'
  workflow_dispatch:
    inputs:
      validate_only:
        description: 'Validate Apple inventory response without sending email'
        type: boolean
        default: true
      test_push:
        description: 'Send a repeating Pushover test (no stock check)'
        type: boolean
        default: false
      test_email:
        description: 'Send an email test (requires secrets)'
        type: boolean
        default: false
      simulate_available:
        description: 'Send a simulated in-stock email (no real stock required)'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: apple-stock-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Restore previous state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view monitor-state >/dev/null 2>&1; then
            gh release download monitor-state --pattern default.stock-state.json --dir .
            mv default.stock-state.json .stock-state.json
          else
            echo "No previous state release (first run)"
          fi
      - name: Check pickup availability
        env:
          ZIP_CODE: '95050'
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
          PUSHOVER_APP_TOKEN: ${{ secrets.PUSHOVER_APP_TOKEN }}
          PUSHOVER_USER_KEY: ${{ secrets.PUSHOVER_USER_KEY }}
          TEST_PUSH: ${{ inputs.test_push }}
          VALIDATE: ${{ inputs.validate_only }}
          TEST_EMAIL: ${{ inputs.test_email }}
          SIMULATE: ${{ inputs.simulate_available }}
        run: |
          if [ "$TEST_PUSH" = "true" ]; then
            python monitor.py --test-push
          elif [ "$TEST_EMAIL" = "true" ]; then
            python monitor.py --test-email
          elif [ "$SIMULATE" = "true" ]; then
            python monitor.py --simulate-available
          elif [ "$VALIDATE" = "true" ] || [ "${{ github.event_name }}" = "push" ]; then
            python monitor.py --validate-only
          else
            python monitor.py
          fi
      - name: Save state for next check
        if: ${{ success() && github.event_name != 'push' && !inputs.validate_only && !inputs.test_push && !inputs.test_email && !inputs.simulate_available }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view monitor-state >/dev/null 2>&1; then
            gh release upload monitor-state .stock-state.json#stock-state.json --clobber
          else
            gh release create monitor-state .stock-state.json#stock-state.json --title "Monitor state" --notes "Internal state for deduplicating alerts" --latest=false
          fi
      - name: Email on scheduled check failure
        if: ${{ failure() && github.event_name == 'schedule' }}
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
        run: python monitor.py --failure-email
